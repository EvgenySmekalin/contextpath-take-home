services:
  # One for everybody: stores popups and serves GET /audit on localhost:8080.
  server:
    build: .
    image: contextpath:local
    command: ["python", "-m", "server.main"]
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 15

  # One streamer + one agent process per ./data/*.tar.gz (see src/launcher.py).
  # Exits with code 0 when every recording has been replayed.
  employees:
    build: .
    image: contextpath:local
    command: ["python", "-m", "launcher"]
    init: true
    environment:
      TICK_MS: ${TICK_MS:-20}
      SERVER_URL: http://server:8080
      DATA_DIR: /data
      RULES_PATH: /config/rules.json
    volumes:
      - ./data:/data:ro
      - ./rules.json:/config/rules.json:ro
    depends_on:
      server:
        condition: service_healthy
