[project]
name = "contextpath"
version = "0.1.0"
description = "ContextPath take-home: streamer -> agent -> server"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# The docker test builds and starts the whole stack: run it with `pytest -m docker`.
addopts = "-q -m 'not docker'"
markers = ["docker: starts the stack with docker compose (slow, needs Docker)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
